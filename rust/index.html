<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rust — Learning Path</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: { sans: ['Inter','system-ui','sans-serif'], mono: ['JetBrains Mono','monospace'] },
      colors: { ink: '#050811' }
    }
  }
}
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { background: #050811; margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; }
  .navbar {
    height: 56px; background: rgba(10, 15, 29, 0.95); backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(148, 163, 184, 0.12); display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; z-index: 50; position: fixed; top: 0; left: 0; right: 0;
  }
  .back-btn { display: flex; align-items: center; gap: 8px; color: #94a3b8; font-size: 13px; font-weight: 600; text-decoration: none; transition: color 0.2s; }
  .back-btn:hover { color: #fff; }
  .course-title { font-size: 14px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px; }
  .course-title .badge { font-size: 10px; background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 999px; }
  iframe { width: 100%; height: calc(100vh - 56px); margin-top: 56px; border: none; display: block; background: #fff; }
</style>
</head>
<body>
  <div class="navbar">
    <a href="/" class="back-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Course Catalog
    </a>
    <div class="course-title">
      Rust Masterclass <span class="badge">Interactive</span>
    </div>
    <div style="width: 100px;"></div> <!-- Spacer for center alignment -->
  </div>
  <iframe src="https://rust.syamsulbahri.dev/" loading="lazy"></iframe>
</body>
</html>
